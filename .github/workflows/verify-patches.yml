name: Verify patches apply cleanly

# This does NOT run the FPGA build (that needs Vivado, which can't reasonably
# run on a hosted GitHub Actions runner). It checks the cheap, fast thing a
# hosted runner *can* verify: that setup_fpga.sh's clone-and-patch step still
# works. That catches upstream rewriting/force-pushing its history (the scripts
# pin an exact commit, so this mainly guards against that commit disappearing)
# and catches any patch that no longer applies.
#
# What is NOT here, and is in the R1 repository's copy of this file: the job
# that applies the whole of firmware/patches/ to the full vendor tree (its 5.15
# kernel, Buildroot). The R2 uses the hdl/ hunks of that series, checked below,
# and its u-boot-xlnx/ hunks, checked by verify-modern.yml; the rest is never
# applied here.

on:
  push:
    paths:
      - "firmware/patches/**"
      - "firmware/revs/**"
      - "firmware/scripts/setup_fpga.sh"
      - "firmware/scripts/rev.sh"
      - ".github/workflows/verify-patches.yml"
  pull_request:
    paths:
      - "firmware/patches/**"
      - "firmware/revs/**"
      - "firmware/scripts/setup_fpga.sh"
      - "firmware/scripts/rev.sh"
  schedule:
    # Weekly, so upstream disappearing/force-pushing is caught even when
    # nobody's actively touching this repo.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  verify-r2:
    name: The PlutoSky R2's FPGA series applies
    # firmware/patches/ with firmware/revs/r2/patches/ replacing or adding,
    # applied to hdl/ only (firmware/scripts/setup_fpga.sh, rev.sh).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run setup_fpga.sh (sparse hdl/ + the R2 series)
        run: ./firmware/scripts/setup_fpga.sh
      - name: It is idempotent
        run: ./firmware/scripts/setup_fpga.sh | grep -q 'already applied - nothing to do'
      - name: The tree is the R2's design, with this repo's FPGA changes in it
        run: |
          P=firmware/src/hdl/projects/pluto
          grep -q '"xc7z020clg484-2"' $P/system_project.tcl
          test -f $P/ADF4001_init.v
          test -f $P/tx_gpio_bitmap.v
          grep -q 'gmii_to_rgmii' $P/system_bd.tcl
          # The four sample-GPIO outputs, on the R2's header balls and no others.
          for pin in M19 M20 M21 M22; do
            [ "$(grep -c "PACKAGE_PIN $pin " $P/system_constr.xdc)" -eq 1 ] || {
              echo "::error::$pin must be constrained exactly once"; exit 1; }
          done
          # 0009: the crossing constraint names both ends.
          grep -q 'up_dac_gpio_out_int_reg' $P/system_constr.xdc
          # No ball may be claimed twice - a wrong PACKAGE_PIN is not a build error
          # until place_design, 40 minutes in.
          dup=$(grep -oE 'PACKAGE_PIN +[A-Z]+[0-9]+' $P/system_constr.xdc | awk '{print $2}' | sort | uniq -d)
          [ -z "$dup" ] || { echo "::error::balls constrained twice: $dup"; exit 1; }
      - name: The series is the R1's with the R2's three patches over it
        run: |
          source firmware/scripts/rev.sh
          devkit_patch_series "$PWD/firmware" > /tmp/series
          # every revs/r2 patch is in it, and none of the three it replaces or adds is the R1's
          for p in firmware/revs/r2/patches/*.patch; do grep -qxF "$PWD/$p" /tmp/series; done
          [ "$(grep -c '/revs/r2/patches/' /tmp/series)" -eq 3 ]
          ! grep -q "/firmware/patches/0006-" /tmp/series
          ! grep -q "/firmware/patches/0009-" /tmp/series
          # and r1 is refused, with where to find it
          ! DEVKIT_REV=r1 bash -c 'source firmware/scripts/rev.sh' 2> /tmp/err
          grep -q 'matsvandamme/fishball7020-fpga-devkit' /tmp/err
