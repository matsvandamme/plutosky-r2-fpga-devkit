<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="760" height="150" role="img"><title>The BOOT switch set to SD: both sliders away from ON</title><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4069FF"/></marker><marker id="a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d6293e"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1a9e5c"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#141415"/></marker></defs><rect x="20" y="20" width="170" height="110" rx="8" fill="#f8f8f8" stroke="#c9c9cf" stroke-width="1.5"/><text x="105.0" y="80.0" font-size="14" font-weight="600" fill="#141415" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"></text><text x="105" y="44" font-size="13" font-weight="600" fill="#141415" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">ON</text><rect x="58" y="56" width="36" height="60" rx="5" fill="#f8f8f8" stroke="#c9c9cf" stroke-width="1.5"/><rect x="62" y="86" width="28" height="26" rx="4" fill="#4069FF"/><rect x="116" y="56" width="36" height="60" rx="5" fill="#f8f8f8" stroke="#c9c9cf" stroke-width="1.5"/><rect x="120" y="86" width="28" height="26" rx="4" fill="#4069FF"/><text x="220" y="52" font-size="14" font-weight="600" fill="#141415" text-anchor="start" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">SD card: both sliders away from ON</text><text x="220" y="76" font-size="12.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">What this firmware boots from. Set it with the board off.</text><text x="220" y="100" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">A wrong position is silent: nothing appears,</text><text x="220" y="118" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">not even on the serial console.</text></svg>
