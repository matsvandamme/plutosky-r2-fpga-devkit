<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>Which of the PlutoSky R2's sockets goes where</title><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4069FF"/></marker><marker id="a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d6293e"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1a9e5c"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#141415"/></marker></defs><rect x="280" y="30" width="200" height="240" rx="8" fill="#f8f8f8" stroke="#c9c9cf" stroke-width="1.5"/><text x="380.0" y="155.0" font-size="14" font-weight="600" fill="#141415" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"></text><text x="380" y="58" font-size="14" font-weight="600" fill="#141415" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">The PlutoSky R2</text><text x="380" y="77" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">BOOT switch: SD</text><rect x="300" y="100" width="160" height="42" rx="8" fill="#e9eeff" stroke="#4069FF" stroke-width="1.5"/><text x="380.0" y="117.5" font-size="14" font-weight="600" fill="#141415" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">ETH</text><text x="380.0" y="136.5" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">RJ45</text><rect x="300" y="156" width="160" height="42" rx="8" fill="#e9eeff" stroke="#4069FF" stroke-width="1.5"/><text x="380.0" y="173.5" font-size="14" font-weight="600" fill="#141415" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">DEBUG</text><text x="380.0" y="192.5" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">USB-C</text><rect x="300" y="212" width="160" height="42" rx="8" fill="#e9eeff" stroke="#4069FF" stroke-width="1.5"/><text x="380.0" y="229.5" font-size="14" font-weight="600" fill="#141415" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">USB2.0</text><text x="380.0" y="248.5" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">USB-C</text><rect x="20" y="94" width="180" height="54" rx="8" fill="#f8f8f8" stroke="#c9c9cf" stroke-width="1.5"/><text x="110.0" y="117.5" font-size="14" font-weight="600" fill="#141415" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Your router</text><text x="110.0" y="136.5" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">hands out the address</text><line x1="300" y1="121" x2="202" y2="121" stroke="#4069FF" stroke-width="1.6" marker-end="url(#a-accent)"/><text x="250" y="112" font-size="12" font-weight="400" fill="#4069FF" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">network</text><text x="110" y="176" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">then, from your PC:</text><text x="110" y="195" font-size="12.5" font-weight="400" fill="#4069FF" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace">ssh root@fishball.local</text><rect x="560" y="150" width="180" height="54" rx="8" fill="#f8f8f8" stroke="#c9c9cf" stroke-width="1.5"/><text x="650.0" y="173.5" font-size="14" font-weight="600" fill="#141415" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">USB power</text><text x="650.0" y="192.5" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">and the serial console</text><line x1="558" y1="177" x2="462" y2="177" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#a-muted)"/><text x="510.0" y="169.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">power</text><rect x="560" y="212" width="180" height="54" rx="8" fill="#f8f8f8" stroke="#c9c9cf" stroke-width="1.5"/><text x="650.0" y="235.5" font-size="14" font-weight="600" fill="#141415" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">USB power</text><text x="650.0" y="254.5" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">the second socket</text><line x1="558" y1="233" x2="462" y2="233" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#a-muted)"/><text x="510.0" y="225.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">power</text><text x="650" y="100" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Connect both: one alone</text><text x="650" y="117" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">can be short of power</text></svg>
