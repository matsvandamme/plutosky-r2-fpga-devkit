# The documentation site: docs/ rendered with MkDocs Material.
#
#     # run from: the repo root
#     pip install -r docs-site/requirements.txt
#     mkdocs serve          # http://127.0.0.1:8000, rebuilds as you edit
#     mkdocs build --strict # what CI runs; any broken link or anchor fails it
#
# docs/ stays plain GitHub Markdown: docs-site/hooks.py makes the site's heading
# anchors and out-of-docs links behave the way GitHub's do. The images are
# copied through unchanged.
site_name: PlutoSky R2 FPGA Devkit
site_description: Buildable firmware and documentation for the PlutoSky R2 software-defined radio. Zynq XC7Z020-CLG484 and AD9361.
site_url: https://matsvandamme.github.io/plutosky-r2-fpga-devkit/
repo_url: https://github.com/matsvandamme/plutosky-r2-fpga-devkit
repo_name: plutosky-r2-fpga-devkit
edit_uri: edit/main/docs/
copyright: GPL-2.0 · the PlutoSky R2 only · radio measurements on this site were taken on an R1 unless they say otherwise

docs_dir: docs
exclude_docs: |
  check_links.py
  /README.md

hooks:
  - docs-site/hooks.py

plugins:
  - search
  # A preview image per page for links shared on chat and social sites. Needs
  # the imaging extras (cairo); see docs-site/requirements.txt.
  - social:
      cards_layout_options:
        background_color: "#4069FF"

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  # The blue mark: the header is white, as on the Saleae support site.
  logo: img/vmat-mark-blue.svg
  font:
    text: Inter
    code: JetBrains Mono
  favicon: img/vmat-mark-blue.svg
  # Not navigation.instant: it loads pages by XHR, which breaks plain-HTML
  # pages served alongside the docs, such as the course.
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - navigation.path       # breadcrumbs above the title
    - navigation.footer     # previous / next at the foot of each page
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/vmat.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  # ```mermaid blocks render as diagrams
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  # === "fish" / === "bash" content tabs
  - pymdownx.tabbed:
      alternate_style: true
  # :material-...: icons on the home page cards and in callouts
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

